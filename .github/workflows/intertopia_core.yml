name: Intertopia Core CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/typing_extensions.py

  tests:
    name: Run tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install coverage
        run: pip install 'coverage[toml]'

      - name: Run tests with coverage
        run: |
          cd src
          python --version
          python -m coverage run -m unittest test_typing_extensions.py
          coverage xml --rcfile=../pyproject.toml --fail-under=0

  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

name: Intertopía - Ejecución de Ciclo y Validación
on:
  schedule:
    - cron: '*/5 * * * *' # Ejecución cada 5 segundos para flujo constante de valor
  workflow_dispatch: # Permite ejecución manual por el Administrador (VHRS)

jobs:
  asset_management:
    runs-on: ubuntu-latest
    env:
      ADMIN_ID: "Víctor Hugo Ramírez Salgado"
      VAULT_NAME: "Víctor Hugo's Personal Vault"
      GOLD_LIMIT: 25.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Execute Intertopía Asset Script
        run: |
          python main_intertopia.py
        env:
          [span_2](start_span)SIGNATURE_VALIDATION: "731756*" # Firma de autoridad administrativa[span_2](end_span)

      - name: Issue Property Certificates
        if: success()
        run: |
          echo "Generando Certificado de Propiedad y Plusvalía de Activos..."
          # [span_3](start_span)Integración con el sistema de emisión automática[span_3](end_span)

