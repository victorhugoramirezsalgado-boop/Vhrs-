name: 1NTERTOPIA Terminal Engine

on:
  push:
    branches: [ main ]

jobs:
  run-analytical-core:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Inicializar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Inyectar Librerías
        run: |
          pip install google-generativeai requests

      - name: 4. Ejecutar Terminal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python main.py

